name: Server Web CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: node scripts/check-toolchain.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/check-env-sync.mjs
      - run: pnpm lint
      - run: pnpm --filter @audio/opus-encode test
      - run: pnpm --filter @soqaro/shared build
      - run: pnpm --filter @soqaro/server typecheck
      - run: pnpm --filter @soqaro/web typecheck
      - run: pnpm --filter @soqaro/server test
      - run: pnpm --filter @soqaro/web test
      - run: pnpm --filter @soqaro/server build
      - run: pnpm --filter @soqaro/web build

  docker-images:
    if: github.event_name == 'push'
    needs:
      - validate-and-test
      - e2e
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: server-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/soqaro-server
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - id: web-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/soqaro-web
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          no-cache: true
          # 地址类 NEXT_PUBLIC_* 在构建期内联,运行时 env 无效。
          # 主链路:TURN 凭据由服务端 /v1/realtime/ice-config 签发,静态 TURN_* 仅是
          # ice-config 不可用时的兜底;API/WS 空值会回退相对路径。
          # 要让 CI 镜像完全自足,在仓库 Variables 配置以下 NEXT_PUBLIC_* 即可。
          # 裸机路线(deploy.sh 拷 .env 后构建)不受此影响,值已内联进产物。
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_SOCKET_PATH=${{ vars.NEXT_PUBLIC_SOCKET_PATH }}
            NEXT_PUBLIC_STUN_URL=${{ vars.NEXT_PUBLIC_STUN_URL }}
            NEXT_PUBLIC_TURN_URL=${{ vars.NEXT_PUBLIC_TURN_URL }}
            NEXT_PUBLIC_TURN_USERNAME=${{ vars.NEXT_PUBLIC_TURN_USERNAME }}
            NEXT_PUBLIC_TURN_CREDENTIAL=${{ vars.NEXT_PUBLIC_TURN_CREDENTIAL }}
            NEXT_PUBLIC_WEBRTC_ICE_SERVERS=${{ vars.NEXT_PUBLIC_WEBRTC_ICE_SERVERS }}
            NEXT_PUBLIC_NETEASE_ENABLED=true
            NEXT_PUBLIC_QQMUSIC_ENABLED=true
            NEXT_PUBLIC_KUGOU_ENABLED=true
            NEXT_PUBLIC_KUWO_ENABLED=true
            NEXT_PUBLIC_TAIHE_ENABLED=true
            NEXT_PUBLIC_MIGU_ENABLED=true
            NEXT_PUBLIC_BAIDU_ENABLED=false
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}

  e2e:
    needs: validate-and-test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: node scripts/check-toolchain.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @soqaro/shared build
      - run: pnpm --filter @soqaro/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          REDIS_URL: redis://127.0.0.1:6379/15

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
